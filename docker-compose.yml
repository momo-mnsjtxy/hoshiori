# 出厂即跑的一套：网关加面板，产物和数据都在卷里。
# 用法：docker compose up -d       然后 curl 127.0.0.1:8080/v1/models
# 换后端：改 serve 的 command，或者在 .env 里给 ORI_TOKEN。

services:
  serve:
    build: .
    image: hoshiori:local
    command: ["serve", "/data/model", "--port", "8080", "--host", "0.0.0.0", "--log", "/data/gateway.jsonl"]
    environment:
      ORI_TOKEN: "${ORI_TOKEN:?先在 .env 里给一个令牌}"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ori", "doctor"]
      interval: 30s
      timeout: 5s
      retries: 3

  loom:
    image: hoshiori:local
    command: ["loom", "/data/bolt", "--port", "8765", "--host", "0.0.0.0"]
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data:ro
    depends_on:
      serve:
        condition: service_healthy
    restart: unless-stopped
