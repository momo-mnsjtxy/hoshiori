# 网关和可编辑面板。先按 docs/DEPLOY.md 准备 data 与两份访问令牌，再 build/up。
services:
  serve:
    build: .
    image: hoshiori:local
    command: ["serve", "/data/model", "--backend", "echo", "--port", "8080", "--host", "0.0.0.0", "--log", "/data/gateway.jsonl"]
    environment:
      ORI_TOKEN: "${ORI_TOKEN:?先在 .env 里给网关令牌}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "${ORI_DATA_DIR:-./data}:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/v1/models',headers={'Authorization':'Bearer '+os.environ['ORI_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 6

  loom:
    image: hoshiori:local
    command: ["loom", "/data/bolt", "--port", "8765", "--host", "0.0.0.0"]
    environment:
      ORI_LOOM_TOKEN: "${ORI_LOOM_TOKEN:?先在 .env 里给面板令牌}"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - "${ORI_DATA_DIR:-./data}:/data"
    depends_on:
      serve:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/',headers={'Authorization':'Bearer '+os.environ['ORI_LOOM_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 6
