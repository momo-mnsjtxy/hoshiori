# 格式服从：JSON、列表、单位、小数位，6 题。只认格式，不认聪明。
name: format-lite
desc: 格式服从（6 题，JSON / 列表 / 单位 / 小数位）
tasks:
  - id: json-array
    prompt: 只输出 JSON 数组 [1, 2, 3]，不要代码块标记，不要解释。
    rule: regex
    pattern: ^\s*\[\s*1\s*,\s*2\s*,\s*3\s*\]\s*$
    why: 只给数组本体，多写一个字都算错
  - id: json-bool
    prompt: 除法 1 除以 2 能不能整除？只输出 JSON 的布尔值。
    rule: exact
    answer: "false"
    why: 只能写 false，写「不能」不算
  - id: json-ok
    prompt: 只输出一个 JSON 对象，键 ok 的值是布尔 true，不要解释。
    rule: regex
    pattern: ^\s*\{\s*"ok"\s*:\s*true\s*\}\s*$
    why: 对象与布尔值的写法
  - id: gram
    prompt: 3.5 千克等于多少克？只写数字。
    rule: contains
    keywords: ["3500"]
    why: 单位换算，不许写千分位
  - id: pipe-path
    prompt: 把三段目录 a、b、c 用竖线连成一行 a|b|c，只写这一行。
    rule: exact
    answer: a|b|c
    why: 固定分隔符，顺序不许换
  - id: pi-two
    prompt: 圆周率保留两位小数，只写数字。
    rule: exact
    answer: "3.14"
    why: 小数位服从，多一位少一位都错
