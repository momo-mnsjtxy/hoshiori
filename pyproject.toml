[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoshiori"
version = "0.1.0.dev0"
description = "星织 — 从语料到上线的全链路开源训练与评测台"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
speed = ["numpy>=1.26"]
dedup = ["numpy>=1.26", "blake3>=0.3"]
full = ["numpy>=1.26", "blake3>=0.3", "torch>=2.4", "safetensors>=0.4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ori = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["commands", "features", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"  # slow 是十万条压测，pytest -m slow 单独跑
markers = ["slow: 跑得慢的压测，默认不跑"]

[tool.ruff]
line-length = 100
target-version = "py310"
